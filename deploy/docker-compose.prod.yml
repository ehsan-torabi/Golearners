# Production compose — single node behind Caddy (TLS automatic).
# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
name: golearn-prod

services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-golearn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-golearn}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: docker.arvancloud.ir/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    image: docker.arvancloud.ir/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p --ignore-existing local/${S3_BUCKET:-golearn-media}"
    restart: "no"

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_BASE_URL: ${SITE_URL:?set in .env}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-golearn}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-golearn-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      VOD_PROVIDER: ${VOD_PROVIDER:-local}
      PAYMENT_ZARINPAL_MERCHANT_ID: ${PAYMENT_ZARINPAL_MERCHANT_ID:-}
      PAYMENT_ZARINPAL_SANDBOX: ${PAYMENT_ZARINPAL_SANDBOX:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["/worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-golearn}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-golearn-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      VOD_PROVIDER: ${VOD_PROVIDER:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080        # browser requests go through caddy; server fetch internal
      API_INTERNAL: http://api:8080
      SITE_URL: ${SITE_URL}
    depends_on:
      - api

  caddy:
    image: docker.arvancloud.ir/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env e.g. golearn.ir}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
