name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # wired now so integration tests (phase 3+) need no workflow changes
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: golearn
          POSTGRES_PASSWORD: golearn
          POSTGRES_DB: golearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U golearn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: migrate (test database)
        run: go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://golearn:golearn@localhost:5432/golearn?sslmode=disable
      - name: test
        run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://golearn:golearn@localhost:5432/golearn?sslmode=disable
