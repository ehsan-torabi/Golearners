<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>به‌زودی | گوLearners</title>
    <meta
      name="description"
      content="وب‌سایت گوLearners در دست ساخت است — آموزش برنامه‌نویسی به فارسی، به‌زودی در golearners.ir."
    />
    <meta name="theme-color" content="#e8e6e1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='21' r='9' fill='%23f0964a'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="orbs" aria-hidden="true">
      <span class="orb orb--a"></span>
      <span class="orb orb--b"></span>
    </div>

    <main class="card">
      <header class="bar">
        <a class="logo" href="/"
          ><span class="logo__mark" aria-hidden="true"></span
          ><span class="logo__text"
            >گو<span class="logo__en">Learners</span></span
          ></a
        >

        <div class="bar__actions">
          <a class="btn-close" href="/" aria-label="بستن">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </a>
        </div>
      </header>

      <section class="hero">
        <div class="dome" aria-hidden="true">
          <span class="dome__glow"></span>
          <span class="dome__body"></span>
        </div>
        <div class="hero__content">
          <h1 class="hero__title">به‌زودی!</h1>
          <p class="hero__sub">وب‌سایت در دست ساخت است</p>
        </div>
      </section>

      <section class="follow">
        <p class="follow__text">
          در جریان بمانید — ما را در شبکه‌های اجتماعی دنبال کنید
        </p>
        <div class="social">
          <a
            class="social__btn"
            href="https://ehsantorabi.ir"
            aria-label="وب‌سایت شخصی"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path
                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
              /></svg
          ></a>
          <a
            class="social__btn"
            href="https://www.instagram.com/ehsan.t.frs"
            aria-label="اینستاگرام"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" />
              <circle cx="12" cy="12" r="4.2" />
              <line x1="17.4" y1="6.6" x2="17.41" y2="6.6" /></svg
          ></a>
          <a
            class="social__btn"
            href="https://t.me/ehsan_torabi_frs"
            aria-label="تلگرام"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" /></svg
          ></a>

          <a
            class="social__btn"
            href="https://github.com/ehsan-torabi"
            aria-label="گیت‌هاب"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
              />
              <path d="M9 18c-4.51 2-5-2-7-2" /></svg
          ></a>
          <a
            class="social__btn"
            href="mailto:me@ehsantorabi.ir"
            aria-label="ایمیل"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="3" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg
          ></a>
        </div>
      </section>

      <footer class="foot"></footer>
    </main>

</html>
